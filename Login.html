<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackX-Login</title>
    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
    <!-- font awosome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Oi&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Oi&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Black+Ops+One&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Oi&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

</head>

<body class="page page-login">

    <div class="auth-background-glow"></div>

    <header class="site-header">
        <nav class="site-nav">
            <a href="index.html" class="brand-logo">
                <span class="brand-logo-primary">TRACK</span>
                <span class="brand-logo-accent">X</span>
            </a>

            <div class="site-nav-actions">
                <a href="Signup.html" class="nav-link nav-link-secondary">Sign up</a>
            </div>

        </nav>

    </header>

    <section class="auth-section auth-section-login" id="login">

        <div class="auth-card auth-card-login">

            <div class="auth-card-form auth-card-form-login">

                <div class="auth-logo">
                    <div class="auth-logo-image"></div>
                </div>


                <div class="auth-form-intro auth-form-intro-login">

                    <div class="auth-form-title auth-form-title-login">
                        <p class="auth-form-title-text">Welcome Back!</p>
                    </div>

                    <div class="auth-form-subtitle auth-form-subtitle-login">
                        <p class="auth-form-subtitle-text">Welcome back! Enter Your Details And Start Tracking Your Progress.</p>
                    </div>

                </div>

                <div class="auth-form-fields auth-form-fields-login">

                    <input id="login-email" placeholder="Email" type="email" class="form-input form-input-email">
                    <input id="login-password" placeholder="Password" type="password" class="form-input form-input-password">

                </div>

                <div class="auth-options">

                    <div class="auth-options-remember">
                        <input id="login-remember" type="checkbox" class="auth-options-checkbox">
                        <p class="auth-options-label">Remember For 30 Days</p>
                    </div>

                    <div class="auth-options-forgot text-link text-link-accent">
                        <p class="auth-options-forgot-text">Forgot Password</p>
                    </div>

                </div>

                <div class="auth-form-submit auth-form-submit-login">
                    <a href="#" class="auth-form-submit-text">Login</a>
                </div>

                <div class="auth-social auth-social-login">

                    <div class="auth-social-divider auth-social-divider-login">

                        <div class="auth-social-line auth-social-line-login"></div>

                        <div class="auth-social-label auth-social-label-login">
                            <p class="auth-social-label-text">Login With</p>
                        </div>

                        <div class="auth-social-line auth-social-line-login"></div>

                    </div>

                    <div class="auth-social-providers auth-social-providers-login">

                        <a href="#" class="social-button social-button-google">
                            <div class="social-button-icon social-button-icon-google"></div>
                            <div class="social-button-text">
                                <p class="social-button-label">Google</p>
                            </div>
                        </a>

                        <a href="#" class="social-button social-button-apple">
                            <div class="social-button-icon social-button-icon-apple"></div>
                            <div class="social-button-text">
                                <p class="social-button-label">Apple</p>
                            </div>

                        </a>

                    </div>

                </div>

                <div class="auth-form-switch auth-form-switch-login">
                    <p class="auth-form-switch-text">Don't Have An Account <span class="auth-form-switch-action"><a href="Signup.html" class="text-link text-link-accent"> Create One </a></span></p>
                </div>

            </div>

            <div class="auth-card-visual auth-card-visual-login"></div>

        </div>

    </section>

</body>

</html>
