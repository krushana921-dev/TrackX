<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackX-Login</title>
    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
    <!-- font awosome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Oi&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Oi&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Black+Ops+One&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Oi&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="bg-glow"></div>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <span class="logo-primary">TRACK</span>
                <span class="logo-accent">X</span>
            </a>

            <div class="cta-buttons">
                <a href="Signup.html" class="sign-up">Sign up</a>
            </div>

        </nav>
    </header>

    <section class="login-section">

        <div class="login-box">

            <div class="login-area">

                <div class="trackx-logo-area">
                    <div class="trackx-logo"></div>
                </div>
                

                <div class="welcome-container">

                    <div class="welcome-txt">
                    <p>Welcome Back!</p>
                    </div>

                    <div class="welcome-sentence">
                    <p>Welcome back! Enter Your Details And Start Tracking Your Progress.</p>
                    </div>

                </div>

                <div class="input-container">
                    
                    <input placeholder="Email" type="email" class="email input-info">
                    <input placeholder="Password" type="password" class="password input-info">
                
                </div>
                
                <div class="remember-info-pass-container">

                    <div class="remember-email-pass">
                    <input type="checkbox">
                    <p>Remember For 30 Days</p>
                    </div>

                    <div class="forgotpass orange-text">
                        <p>Forgot Password</p>
                    </div>

                </div>
                
                <div class="login-btn">
                    <a href="#" class="login-txt">Login</a>
                </div>

                <div class="login-with">

                    <div class="login-text-section">

                        <div class="login-line"></div>

                        <div class="login-with-text">
                            <p>Login With</p>
                        </div>

                        <div class="login-line"></div>

                    </div>
                
                    <div class="login-companies">

                        <a href="#" class="register-google register-box">
                            <div class="register-google-logo"></div>
                            <div class="register-google-text">
                                <p>Google</p>
                            </div>
                        </a>   

                        <a href="#" class="register-apple register-box">
                            <div class="register-apple-logo"></div>
                            <div class="register-apple-text">
                                <p>Apple</p>
                            </div>

                        </a>

                    </div> 

                </div>

                <div class="create-acc">
                    <p>Don't Have An Account <span><a  href="Signup.html" class="orange-text"> Create One </a> </span></p>
                </div>

            </div>

            <div class="login-visual-box"></div>

        </div>

    </section>

</body>

</html>
