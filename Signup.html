<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackX-sign up</title>
    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
    <!-- font awosome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Oi&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Oi&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Black+Ops+One&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Oi&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

</head>

<body class="page page-signup">

    <div class="auth-background-glow"></div>

    <header class="site-header">
        <nav class="site-nav">
            <a href="index.html" class="brand-logo">
                <span class="brand-logo-primary">TRACK</span>
                <span class="brand-logo-accent">X</span>
            </a>

            <div class="site-nav-actions">
                <a href="Login.html" class="nav-link nav-link-primary">Login</a>
            </div>

        </nav>
    </header>

    <section class="auth-section auth-section-signup" id="signup">

        <div class="auth-card auth-card-signup">

            <div class="auth-card-visual auth-card-visual-signup"></div>

            <div class="auth-card-form auth-card-form-signup">

                <div class="auth-form-title auth-form-title-signup">
                    <p class="auth-form-title-text">Create An Account</p>
                </div>

                <div class="auth-form-subtitle auth-form-subtitle-signup">
                    <p class="auth-form-subtitle-text">Create an account and watch your consistency compound over time.</p>
                </div>

                <div class="auth-form-fields auth-form-fields-signup">
                    <div class="auth-form-name-row">
                        <input id="signup-first-name" placeholder="Name" type="text" class="form-input form-input-first-name">
                        <input id="signup-last-name" placeholder="Last Name" type="text" class="form-input form-input-last-name">
                    </div>
                    <input id="signup-email" placeholder="Email" type="email" class="form-input form-input-email">
                    <input id="signup-password" placeholder="Password" type="password" class="form-input form-input-password">
                </div>



                <div class="auth-form-terms">
                    <input id="signup-terms" type="checkbox" class="auth-form-checkbox">
                    <p class="auth-form-terms-text">I agree to the <a href="#" class="text-link text-link-accent">terms & conditions</a> </p>
                </div>

                <div class="auth-form-submit auth-form-submit-register">
                    <a href="#" class="auth-form-submit-text">Register</a>
                </div>

                <div class="auth-form-switch auth-form-switch-signup">
                    <p class="auth-form-switch-text">Already Have Account? <a href="Login.html" class="text-link text-link-accent">Log in</a></p>
                </div>

                <div class="auth-social auth-social-signup">

                    <div class="auth-social-divider auth-social-divider-signup">

                        <div class="auth-social-line auth-social-line-signup"></div>

                        <div class="auth-social-label auth-social-label-signup">
                            <p class="auth-social-label-text">Or Register With</p>
                        </div>

                        <div class="auth-social-line auth-social-line-signup"></div>

                    </div>


                    <div class="auth-social-providers auth-social-providers-signup">

                        <a href="#" class="social-button social-button-google">
                            <div class="social-button-icon social-button-icon-google"></div>
                            <div class="social-button-text">
                                <p class="social-button-label">Google</p>
                            </div>
                        </a>

                        <a href="#" class="social-button social-button-apple">
                            <div class="social-button-icon social-button-icon-apple"></div>
                            <div class="social-button-text">
                                <p class="social-button-label">Apple</p>
                            </div>

                        </a>

                    </div>
                </div>

            </div>

        </div>

    </section>

</body>

</html>
